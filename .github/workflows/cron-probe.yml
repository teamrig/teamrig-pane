name: cron probe

# A short-lived probe: no scheduled workflow has fired in the teamrig/teamrig repository since the org move. This
# repository had no schedule, so it could not tell a fault of that one repository from one of the whole org. If this
# hourly run fires here, the fault is the other repository's; if it never fires in two hours, it is the org's or the
# account's. It reads nothing and writes nothing, and goes in a follow-up pull request once it has answered.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    name: cron probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "cron probe fired"
